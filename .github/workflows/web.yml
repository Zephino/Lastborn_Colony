# Builds the playable web version on every push to main and publishes it to
# GitHub Pages: https://zephino.github.io/Lastborn_Colony/
# The game's tests run first; if any fail, nothing is published, so the live
# game is never replaced by a broken build.
#
# Recommended one-time setting: GitHub → this repo → Settings → Pages → Build
# and deployment → Source = "GitHub Actions". While the source is "Deploy from
# a branch", GitHub also publishes the README on every push; the deploy job
# below waits for that to finish so the game is always published last, then
# checks the site really shows the game.
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and web export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -sSL -o sums.txt "$base/SHA512-SUMS.txt"
          grep "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" sums.txt | sed "s#  .*#  godot.zip#" | sha512sum -c -
          grep "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" sums.txt | sed "s#  .*#  templates.tpz#" | sha512sum -c -
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q -j templates.tpz "templates/web_*" "templates/version.txt" -d "$templates"
          rm -f godot.zip templates.tpz sums.txt
          ls "$templates"

      - name: Import project
        run: godot --headless --import --path . || true

      - name: Run game tests
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee test-output.txt
          if grep -q "SCRIPT ERROR" test-output.txt; then
            echo "::error::A test stopped with a script error (see above)."
            exit 1
          fi

      - name: Test the online service
        if: hashFiles('leaderboard-api/package.json') != ''
        working-directory: leaderboard-api
        run: node --test test/*.test.js

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          # Stamp the version into the page and add the updater (web/update.js),
          # so browsers always load matching files and pick up new versions.
          v=$(tr -d '[:space:]' < VERSION)
          cp web/update.js build/web/update.js
          sed -i "s/__LASTBORN_VERSION__/$v/g; s|src=\"index.js\"|src=\"index.js?v=$v\"|" build/web/index.html
          grep -q "LASTBORN_VERSION=\"$v\"" build/web/index.html
          grep -q "index.js?v=$v" build/web/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false

      - name: Wait for GitHub's own Pages publish of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Up to 5 minutes; if there is none (source set to GitHub Actions), go ahead.
          for i in $(seq 1 30); do
            open=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            if [ "$open" = "0" ]; then echo "No other Pages publish running."; exit 0; fi
            echo "Waiting for GitHub's Pages publish to finish ($i)…"
            sleep 10
          done
          echo "Still running after 5 minutes; publishing the game anyway."

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Check the site shows the game
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          v=$(tr -d '[:space:]' < VERSION)
          for i in $(seq 1 12); do
            if curl -sfL --max-time 20 "$url?check=$i" | grep -q "LASTBORN_VERSION=\"$v\""; then echo "Version $v is live at $url"; exit 0; fi
            echo "Not the game yet ($i); waiting for GitHub's cache…"
            sleep 15
          done
          echo "::error::$url doesn't show the game. Re-run this workflow, or set Settings → Pages → Source to GitHub Actions."
          exit 1
